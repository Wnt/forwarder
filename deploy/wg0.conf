# WireGuard link to fixed peers behind NAT. Two independent features share the
# one interface, and either alone brings it up:
#
#   SITE_PEER_IP       a site whose hostnames HAProxy forwards :80/:443 to,
#                      TLS unterminated (e.g. a home Kubernetes node).
#   UDP_RELAY_PEER_IP  a peer that a public UDP port range is DNAT'd to, for an
#                      app Caddy cannot front because it is not TCP at all
#                      (QUIC/WebTransport media is the motivating case).
#
# Only rendered/installed by deploy/install.sh when at least one of them is set.
#
# The box is the "server" end: it has the stable public address, so each home
# peer dials out and holds the tunnel open with PersistentKeepalive on its side.
# Nothing inbound is needed at the home end, which is the whole point — the home
# network never opens a port.
#
# The site tunnel needs no routing at all: HAProxy proxies at the application
# level, so the kernel never routes between the tunnel and anything else, and
# that flow carries exactly :80 and :443 to the peer. The UDP relay is the sole
# exception — it turns on ip_forward and the forwarder_nat table, bounded by
# nftables to the configured range and that one peer.
#
# @-placeholders are rendered by deploy/install.sh.
[Interface]
Address = @WG_EDGE_ADDR@/24
ListenPort = @WG_PORT@
PrivateKey = @WG_EDGE_PRIVKEY@

@WG_PEERS@
