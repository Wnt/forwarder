# WireGuard link to a fixed site (e.g. a home Kubernetes node) that HAProxy
# forwards the site hostnames to.
#
# Only rendered/installed by deploy/install.sh when SITE_PEER_IP is set.
#
# The box is the "server" end: it has the stable public address, so the home
# peer dials out and holds the tunnel open with PersistentKeepalive on its side.
# Nothing inbound is needed at the home end, which is the whole point — the home
# network never opens a port.
#
# No NAT and no ip_forward: HAProxy proxies at the application level, so the
# kernel never routes between the tunnel and anything else. The tunnel carries
# exactly two flows, :80 and :443 to the peer.
#
# @-placeholders are rendered by deploy/install.sh.
[Interface]
Address = @WG_EDGE_ADDR@/24
ListenPort = @WG_PORT@
PrivateKey = @WG_EDGE_PRIVKEY@

[Peer]
PublicKey = @WG_PEER_PUBKEY@
AllowedIPs = @SITE_PEER_IP@/32
