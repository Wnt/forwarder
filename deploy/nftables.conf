#!/usr/sbin/nft -f
# Host firewall for the forwarder box.
#
# The exposure model is "everything binds 127.0.0.1 and is reached only through
# Caddy on :443". This ruleset is the backstop for that assumption: inbound is
# dropped by default, so a service that accidentally binds 0.0.0.0 is still
# unreachable from off-box.
#
# install.sh renders @FWD_TCP_RULE@ from FORWARDER_TCP_PORT_RANGE and installs
# the result to /etc/nftables.conf. Edit this template, not the rendered copy.
flush ruleset

table inet forwarder_filter {
	chain input {
		type filter hook input priority filter; policy drop;

		# Replies to anything the box dialed out (apt, ACME, git).
		ct state established,related accept
		ct state invalid drop

		# Loopback is the bus: Caddy -> forwarder happens on 127.0.0.1, so this
		# MUST come before the drop.
		iif "lo" accept

		# ping + path-MTU discovery + IPv6 neighbour discovery.
		ip protocol icmp accept
		ip6 nexthdr icmpv6 accept

		# The only intentionally public ports. :80 stays open for the ACME
		# challenge and the :80->:443 redirect; :443 is the real surface.
		tcp dport { 22, 80, 443 } accept

		# Raw-TCP tunnel range. A comment (opens nothing) unless TCP tunnels are
		# explicitly enabled via FORWARDER_TCP_PORT_RANGE.
		@FWD_TCP_RULE@

		# WireGuard for the site tunnel. A comment unless SITE_PEER_IP is set.
		@WG_RULE@
	}

	# Not a router.
	chain forward {
		type filter hook forward priority filter; policy drop;
	}

	# Outbound unrestricted; return traffic is matched by the established rule.
	chain output {
		type filter hook output priority filter; policy accept;
	}
}
