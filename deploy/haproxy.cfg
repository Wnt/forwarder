# TCP front door. Optional: install.sh only renders and installs this when
# SITE_PEER_IP is set in the env file, and leaves :80/:443 to Caddy otherwise.
#
# WHY HAPROXY IN FRONT OF CADDY AT ALL:
# some backends behind this box must receive TLS *unterminated*. The Kubernetes
# API served at @K8S_HOST@ authenticates callers with a client certificate, and
# a client cert cannot survive a proxy that terminates TLS — Caddy would present
# its own identity and the API server would see an unauthenticated request. So
# :443 is split by SNI in TCP mode and the site hostnames are passed through
# byte-for-byte, while everything else still reaches Caddy (and through it the
# forwarder's tunnels) exactly as before.
#
# @-placeholders are rendered by deploy/install.sh.

global
    log /dev/log local0
    maxconn 4096

defaults
    log     global
    option  dontlognull
    timeout connect 5s
    # Long timeouts: kubectl exec/port-forward and the app's WebSocket hold
    # connections open with no traffic for long stretches.
    timeout client  3600s
    timeout server  3600s

# ---------------------------------------------------------------- :443 (TCP)
frontend https_in
    bind *:443
    mode tcp
    option tcplog

    # Wait for the ClientHello so req.ssl_sni is populated. Without this the
    # first packet is forwarded before the SNI is known and every request lands
    # on the default backend.
    tcp-request inspect-delay 5s
    tcp-request content accept if { req.ssl_hello_type 1 }

    acl is_site req.ssl_sni -i @SITE_HOSTS@
    acl is_site req.ssl_sni -m end @SITE_SUFFIX@
    use_backend site_https if is_site
    default_backend caddy_https

backend site_https
    mode tcp
    # Straight to ingress-nginx on the home node, over WireGuard. No TLS work
    # happens here; cert-manager in the cluster owns those certificates.
    server home @SITE_PEER_IP@:443 check

backend caddy_https
    mode tcp
    # send-proxy-v2: :443 is SNI-split in TCP mode, so Caddy's socket peer is
    # this box's loopback and Caddy honestly recorded
    # `X-Forwarded-For: 127.0.0.1` for every public visitor since this split
    # existed (measured downstream 2026-09-01). A TCP proxy cannot set a header,
    # so the real address travels in the PROXY protocol instead; Caddy's
    # proxy_protocol listener wrapper (deploy/Caddyfile) turns it back into the
    # connection's peer, and everything downstream — X-Forwarded-For included —
    # becomes true again with no other change.
    server caddy 127.0.0.1:@CADDY_HTTPS_PORT@ check send-proxy-v2

# ----------------------------------------------------------------- :80 (HTTP)
# HTTP mode here, not TCP: plaintext has no SNI, so routing has to key off the
# Host header. This carries the ACME http-01 challenges for both sides.
frontend http_in
    bind *:80
    mode http
    option httplog
    # This frontend IS in HTTP mode, so it can do what the :443 one cannot:
    # state the client itself. Carries the ACME http-01 challenges and any
    # plaintext redirect, and keeps the two ports telling the same story.
    option forwardfor

    acl is_site hdr(host) -i @SITE_HOSTS@
    acl is_site hdr(host) -m end @SITE_SUFFIX@
    use_backend site_http if is_site
    default_backend caddy_http

backend site_http
    mode http
    server home @SITE_PEER_IP@:80 check

backend caddy_http
    mode http
    server caddy 127.0.0.1:@CADDY_HTTP_PORT@ check
