# UDP relay NAT — appended to /etc/nftables.conf by deploy/install.sh, and only
# when UDP_RELAY_PEER_IP is set. Not a standalone ruleset: nftables.conf owns the
# `flush ruleset` and the filter table this complements.
#
# What it does: a public UDP port arriving on the box's WAN interface is
# rewritten to the same port on the relay peer's WireGuard address and sent down
# the tunnel. The source is rewritten to the box's own tunnel address, because
# the peer has no route back to an arbitrary internet client — with the srcnat
# every reply returns through conntrack. The peer therefore sees all clients as
# @WG_EDGE_ADDR@ with distinct source ports, which is enough for a per-connection
# protocol like QUIC to keep its 4-tuples apart.
#
# The port is deliberately NOT translated: public :N is peer :N, so the app on
# the peer needs no port map and its signaling only has to name a different host.
#
# @-placeholders are rendered by deploy/install.sh.
table inet forwarder_nat {
	chain prerouting {
		type nat hook prerouting priority dstnat; policy accept;

		# WAN-side only: `iif != wg0` keeps a packet that arrived through the
		# tunnel from being bounced straight back down it.
		iif != "wg0" udp dport { @UDP_RELAY_PORTS@ } dnat ip to @UDP_RELAY_PEER_IP@
	}

	chain postrouting {
		type nat hook postrouting priority srcnat; policy accept;

		oifname "wg0" ip daddr @UDP_RELAY_PEER_IP@ udp dport { @UDP_RELAY_PORTS@ } snat ip to @WG_EDGE_ADDR@
	}
}
