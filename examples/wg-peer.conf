# Peer end of a UDP relay (see "UDP relay" in the README). Goes on the machine
# running the UDP app, as /etc/wireguard/wg0.conf, then:
#
#   wg genkey | tee peer.key | wg pubkey     # give the PUBLIC key to the box
#   systemctl enable --now wg-quick@wg0
#
# This end dials out, so the app's network still opens no inbound port.
[Interface]
# Any address inside the box's WG subnet that no other peer holds. It must match
# the UDP_RELAY_PEER_IP the box was configured with.
Address = 10.66.0.3/24
PrivateKey = <the peer's private key — 0600, never in a repo>

[Peer]
PublicKey = <the box's WG public key>
Endpoint = tunnel.example.com:51820
# Only the tunnel subnet, so this never becomes a default route: ordinary
# traffic from this machine keeps going out its own uplink.
AllowedIPs = 10.66.0.0/24
# The box can only reach a NAT'd peer through a mapping the peer opened, and an
# idle UDP mapping is dropped in ~30-120 s. This is what keeps the relay usable
# when nobody has connected for a while.
PersistentKeepalive = 25
